<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Balett</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f4f1eb;
    --surface: #fffdf8;
    --border: #d9d0be;
    --text: #1a1612;
    --link-color: #1f1687;
    --muted: #7a7060;
    --accent: #7a2222;
    --desc-bg: #d8f0d8;
    --desc-border: #90c890;
    --post-bg: #b0d8b0;
    --post-border: #6eb56e;
    --balett-fg: #f4e8d0;
    --balett-bg: #7a2222;
    --balett-border: #6eb56e;
    --badge-bg: linear-gradient(120deg, #2a2e38 0%, #1a2050 100%);
    --badge-text: #f4e8d0;
    --shadow: 0 2px 12px rgba(0,0,0,0.08), 0 1px 3px rgba(0,0,0,0.05);
  }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  header {
    background: linear-gradient(120deg, rgba(42,46,56,0.78) 0%, rgba(26,32,80,0.78) 100%), url('balett.jpg') center/cover no-repeat;
    padding: 2rem 2rem 1.5rem;
    position: sticky;
    top: 0;
    z-index: 100;
    border-bottom: 3px solid var(--accent);
  }

  header h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(1.4rem, 3vw, 2rem);
    color: #a8d4f0;
    letter-spacing: 0.03em;
    margin-bottom: 1rem;
  }

  #search-wrap {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    max-width: 380px;
  }

  #search {
    width: 100%;
    padding: 0.55rem 1rem;
    border: 1.5px solid #3a4060;
    background: #22283a;
    color: #c8d4e8;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.95rem;
    border-radius: 4px;
    outline: none;
    transition: border-color 0.2s;
  }

  #search::placeholder { color: #9a8a7a; }
  #search:focus { border-color: var(--accent); }

  #count, #post-count {
    display: inline-block;
    background: rgba(255,255,255,0.10);
    font-size: 0.75rem;
    font-weight: 600;
    padding: 0.25em 0.65em;
    border-radius: 6px;
    border: 1px solid rgba(255,255,255,0.18);
    white-space: nowrap;
    letter-spacing: 0.04em;
  }

  #count {
    display: none;
    color: #717984;
  }

  #post-count {
    color: #c8d4e8;
  }


  main {
    padding: 2rem;
    max-width: 1400px;
    margin: 0 auto;
  }

  #grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 1.5rem;
  }

  @media (min-width: 1200px) { #grid { grid-template-columns: repeat(4, 1fr); } }
  @media (max-width: 900px)  { #grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 560px)  { #grid { grid-template-columns: 1fr; } }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    box-shadow: 0 4px 18px rgba(0,0,0,0.10), 0 1px 4px rgba(0,0,0,0.06);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    position: relative;
    transition: transform 0.2s cubic-bezier(.22,.68,0,1.2), box-shadow 0.2s;
  }

  .card-ribbon {
    position: absolute;
    top: 14px;
    right: -34px;
    width: 115px;
    background: #500;
    color: #ff6;
    border: 1px solid #ff6;
    font-size: 0.80rem;
    font-weight: 900;
    text-align: center;
    padding: 2px 0;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    transform: rotate(45deg);
    z-index: 3;
    pointer-events: none;
  }

  .card:hover {
    transform: translateY(-5px) scale(1.01);
    box-shadow: 0 16px 40px rgba(0,0,0,0.15), 0 3px 8px rgba(0,0,0,0.08);
  }

  /* Coloured top banner */
  .card-banner {
    height: 80px;
    background: linear-gradient(135deg, #5a0a0a 0%, #8b1a1a 60%, #b02020 100%);
    flex-shrink: 0;
    position: relative;
  }

  /* Avatar circle — sits half on banner, half on body */
  .card-avatar-wrap {
    position: absolute;
    bottom: -44px;
    left: 50%;
    transform: translateX(-50%);
    width: 111px;
    height: 111px;
    border-radius: 50%;
    border: 4px solid var(--surface);
    box-shadow: 0 4px 14px rgba(0,0,0,0.18);
    background: #e0d8cc;
    overflow: hidden;
    z-index: 2;
  }

  .card-avatar-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: top center;
    display: block;
  }

  .avatar-placeholder {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2.4rem;
    color: #b0a898;
    background: #e8e0d4;
  }

  /* Body sits below banner, needs top padding to clear the avatar */
  .card-body {
    padding: 52px 1.2rem 1rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }

  .card-name {
    font-family: 'Playfair Display', serif;
    font-size: 1.15rem;
    font-weight: 700;
    line-height: 1.25;
    color: var(--text);
    margin-bottom: 0.45rem;
  }

  .badge {
    display: inline-block;
    background: var(--badge-bg);
    color: var(--badge-text);
    font-size: 0.70rem;
    font-weight: 500;
    padding: 0.22em 0.75em;
    border-radius: 20px;
    letter-spacing: 0.06em;
    white-space: nowrap;
    text-transform: uppercase;
    margin-bottom: 0.9rem;
  }

  /* Content sections — full-width strips */
  .section-box {
    width: calc(100% + 2.4rem);
    margin-left: -1.2rem;
    padding: 0.4rem 1.6rem;
    font-size: 0.875rem;
    line-height: 1.55;
    text-align: left;
  }

  a {
    color: var(--link-color);
    text-decoration: none;
    transition: all 0.3s ease;
  }

  a:hover {
    color: var(--link-color);
    text-decoration: underline;
  }

  a:active {
    color: var(--link-color);
    text-decoration: underline;
  }

  a:visited {
    color: var(--link-color);
    text-decoration: underline;
  }

  li {
    display: block;
    padding: 0.2em 0 0.2em 0.5em;
    border-bottom: 1px solid rgba(0,0,0,0.06);
    position: relative;
  }

  li::before {
    content: "•";
    margin: 0 0.5em 0 0;
  }

  .section-box > li::before {
    content: '–';
    position: absolute;
    left: 0;
    opacity: 0.45;
  }

  .section-box > li:last-child {
    border-bottom: none;
  }

  .section-box + .section-box { border-top: none; }
  .desc-box + .post-box + .balett-box { border-top: 2px solid var(--post-border); }
  .section-box:last-child { flex: 1; }

  .desc-box {
    background: var(--desc-bg);
    border-top: 2px solid var(--desc-border);
  }

  .post-box {
    background: var(--post-bg);
    border-top: 2px solid var(--post-border);
    border-radius: 0 0 14px 14px;
  }

  .balett-box {
    color: var(--balett-fg);
    background: var(--balett-bg);
    border-top: 2px solid var(--balett-border);
    border-radius: 0 0 14px 14px;
  }

  /* When no post, desc gets rounded bottom */
  .desc-box:last-child {
    border-radius: 0 0 14px 14px;
  }

  .card-spacer {
    height: 0.8rem;
  }

  #message {
    text-align: center;
    padding: 4rem 2rem;
    color: var(--muted);
    font-size: 1rem;
  }

  .hidden { display: none !important; }
</style>
</head>
<body>

<header>
  <h1>Mehetünk vissza a balettba ugrálni</h1>
  <div id="search-wrap">
    <span id="post-count"></span>
    <input type="search" id="search" placeholder="Keresés névre…" autocomplete="off">
    <span id="count"></span>
  </div>
</header>

<main>
  <div id="message">Betöltés…</div>
  <div id="grid" class="hidden"></div>
</main>

<script>
(async () => {
  const grid = document.getElementById('grid');
  const msg  = document.getElementById('message');
  const searchEl  = document.getElementById('search');
  const countEl   = document.getElementById('count');
  const postCountEl = document.getElementById('post-count');

  // --- Load & parse data.html ---
  let raw;
  try {
    const res = await fetch('data.html');
    if (!res.ok) throw new Error(res.statusText);
    raw = await res.text();
  } catch(e) {
    msg.textContent = 'Nem sikerült betölteni a data.html fájlt: ' + e.message;
    return;
  }

  const persons = parseData(raw);
  if (!persons.length) {
    msg.textContent = 'Nem található személy a konfigurációs fájlban.';
    return;
  }

  // Render all cards
  persons.sort((a, b) => a.id.localeCompare(b.id, undefined, { numeric: true }));
  persons.forEach(p => grid.appendChild(makeCard(p)));
  msg.classList.add('hidden');
  grid.classList.remove('hidden');
  const postCount = persons.filter(p => p.balett).length;
  postCountEl.textContent = `balett: ${postCount} / ${persons.length}`;
  updateCount(persons.length, persons.length);

  // --- Search ---
  searchEl.addEventListener('input', () => {
    const q = searchEl.value.trim().toLowerCase();
    let visible = 0;
    grid.querySelectorAll('.card').forEach(card => {
      const name = card.dataset.name.toLowerCase();
      const show = !q || name.includes(q);
      card.classList.toggle('hidden', !show);
      if (show) visible++;
    });
    updateCount(visible, persons.length);
  });

  function updateCount(shown, total) {
    countEl.textContent = shown === total ? `${total} fő` : `${shown} / ${total}`;
  }

  // --- Parser ---
  function parseData(text) {
    const blocks = text.split(/^\[\[([^\]]+)\]\]/m).slice(1);
    const result = [];
    for (let i = 0; i < blocks.length; i += 2) {
      const id = blocks[i].trim();
      const body = blocks[i + 1] || '';
      const sections = {};
      const parts = body.split(/^\[([^\]]+)\]/m).slice(1);
      for (let j = 0; j < parts.length; j += 2) {
        sections[parts[j].trim()] = (parts[j+1] || '').trim();
      }
      if (id) result.push({ id, ...sections });
    }
    return result;
  }

  // --- Card builder ---
  function makeCard(p) {
    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.name = p.name || p.id;

    // Corner ribbon for cards with balett
    if (p.balett) {
      const ribbon = document.createElement('div');
      ribbon.className = 'card-ribbon';
      ribbon.textContent = 'balett';
      card.appendChild(ribbon);
    }

    // Banner + avatar circle
    const banner = document.createElement('div');
    banner.className = 'card-banner';

    const avatarWrap = document.createElement('div');
    avatarWrap.className = 'card-avatar-wrap';

    const img = new Image();
    img.src = `img/${p.id.split('-').pop()}.jpg`;
    img.alt = p.name || p.id;
    img.onerror = () => {
      avatarWrap.innerHTML = '';
      const ph = document.createElement('div');
      ph.className = 'avatar-placeholder';
      ph.textContent = '\uD83D\uDC64';
      avatarWrap.appendChild(ph);
    };
    avatarWrap.appendChild(img);
    banner.appendChild(avatarWrap);
    card.appendChild(banner);

    // Body — centred name + pill badge
    const body = document.createElement('div');
    body.className = 'card-body';

    const nameEl = document.createElement('div');
    nameEl.className = 'card-name';
    nameEl.textContent = p.name || p.id;
    body.appendChild(nameEl);

    if (p.badge) {
      const badge = document.createElement('span');
      badge.className = 'badge';
      badge.textContent = p.badge;
      body.appendChild(badge);
    } else {
      const sp = document.createElement('div');
      sp.className = 'card-spacer';
      body.appendChild(sp);
    }

    card.appendChild(body);

    // Desc
    if (p.desc) {
      const box = document.createElement('div');
      box.className = 'section-box desc-box';
      box.innerHTML = p.desc;
      card.appendChild(box);
    }

    // Post
    if (p.post) {
      const box = document.createElement('div');
      box.className = 'section-box post-box';
      box.innerHTML = p.post;
      card.appendChild(box);
    }

    // Balett
    if (p.balett) {
      const box = document.createElement('div');
      box.className = 'section-box balett-box';
      box.innerHTML = p.balett;
      card.appendChild(box);
    }

    if (!p.desc && !p.post && !p.balett) {
      const sp = document.createElement('div');
      sp.style.height = '1.2rem';
      card.appendChild(sp);
    }

    return card;
  }
})();
</script>
</body>
</html>
